name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: mise run lint
      - run: mise run test

  tap-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@2026.10.19.1
      - run: brew test-bot --only-tap-syntax

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the core commits the headers reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          commits="$(python3 scripts/tap/drift.py --list-commits)"
          if [ -z "$commits" ]; then
            echo "no header commits to fetch"
            exit 0
          fi
          git init core
          git -C core remote add origin https://github.com/Homebrew/homebrew-core
          for commit in $commits; do
            git -C core fetch --depth=1 --filter=blob:none origin "$commit"
            status="$(gh api "repos/Homebrew/homebrew-core/compare/${commit}...HEAD" --jq .status)"
            case "$status" in
              ahead | identical) ;;
              *)
                echo "header commit ${commit} is not on homebrew-core HEAD (status: ${status})" >&2
                exit 1
                ;;
            esac
          done
      - name: Check drift
        run: python3 scripts/tap/drift.py
        env:
          HOMEBREW_CORE_REPO: core

  pour-test:
    if: github.event_name == 'pull_request'
    needs: [tap-syntax, drift]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@2026.10.19.1
      - uses: jdx/mise-action@v5
        with:
          install_args: python
      - name: Pour changed bottled formulae in build order
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail
          changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" -- Formula | sed 's@.*/@@; s@\.rb$@@')"
          scripts/audit/fetch-api.sh
          order="$(python3 scripts/tap/render.py --print-order)"
          brew trust elioseverojunior/intel
          found=no
          while IFS= read -r name <&3; do
            grep -qxF "$name" <<< "$changed" || continue
            grep -qs '^  bottle do' Formula/*/"${name}.rb" || continue
            found=yes
            if [ -d "$(brew --cellar)/${name}" ]; then
              brew reinstall --force-bottle "elioseverojunior/intel/${name}"
            else
              brew install --force-bottle "elioseverojunior/intel/${name}"
            fi
            brew test "elioseverojunior/intel/${name}"
          done 3<<< "$order"
          if [ "$found" = no ]; then
            echo "no bottled formulae changed"
          fi
